<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabin Bar — Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--ink:#33231c;--brown:#7a5340;--brown-2:#5b3a2b;--brown-3:#8f6249;--cream:#fbf5ef;--paper:#fffdfb;--line:#eddfd4;--latte:#f4e7db;--peach:#f7ded0;--ok:#4f7a61;--warn:#a8672c;--sky:#48687a;--red:#c0553f;--shadow:0 16px 40px rgba(88,54,33,.10);--shadow-sm:0 6px 18px rgba(88,54,33,.07);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',system-ui,Arial,sans-serif;background:
 radial-gradient(1100px 520px at 88% -8%,#f4ddcc 0,transparent 55%),
 radial-gradient(900px 500px at -10% 12%,#f6ece2 0,transparent 50%),
 var(--cream);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease}
button:active{transform:scale(.97)}
h1,h2{margin:0;font-family:'Playfair Display',Georgia,serif;letter-spacing:-.3px}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
aside{width:240px;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
 background:linear-gradient(180deg,rgba(255,250,245,.96),rgba(247,236,226,.94));backdrop-filter:blur(14px);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(97,60,37,.05)}
.brand{display:flex;flex-direction:column;font-family:'Playfair Display',serif;font-size:23px;font-weight:700;margin:6px 12px 22px;color:var(--brown-2)}
.brand:before{content:'🍨';display:grid;place-items:center;width:46px;height:46px;border-radius:15px;font-size:24px;margin-bottom:10px;background:linear-gradient(135deg,#8a5c44,#5f3c2c);box-shadow:0 10px 22px rgba(95,60,44,.35)}
.brand span{font:800 10px 'Plus Jakarta Sans';letter-spacing:2.4px;color:#b08b74;margin-top:4px}
.roles{display:flex;gap:4px;background:#f0e0d3;padding:5px;border-radius:14px;margin:0 4px 20px}
.roles button{flex:1;padding:10px;border-radius:10px;color:#8a6c5a;font-weight:700;font-size:12.5px}
.roles button.active{background:#fffdfb;color:var(--brown-2);box-shadow:var(--shadow-sm)}
nav{display:grid;gap:6px}
nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;color:#7b6152;font-weight:600;font-size:13px}
nav button .ni{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#f2e3d7;font-size:13px;transition:.2s}
nav button:hover{background:#fffaf6;color:var(--brown-2)}
nav button:hover .ni{transform:scale(1.08)}
nav button.active{background:linear-gradient(135deg,#7a5340,#5b3a2b);color:#fff7f1;box-shadow:0 12px 26px rgba(91,58,43,.28)}
nav button.active .ni{background:rgba(255,255,255,.18)}

/* ---------- Main ---------- */
main{flex:1;padding:30px 40px 56px;max-width:1500px;margin:0 auto;width:100%}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;gap:16px}
h1{font-size:32px;color:var(--brown-2)}
.muted{color:#9a8377;font-size:13px;margin-top:6px;line-height:1.55}
.head-actions{display:flex;align-items:center;gap:12px;position:relative}
.notif-wrap{position:relative}.icon-btn{position:relative;width:46px;height:46px;border-radius:14px;background:#fffdfb;border:1px solid var(--line);font-size:18px;display:grid;place-items:center;box-shadow:var(--shadow-sm);overflow:visible}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;background:var(--red);color:#fff;border-radius:11px;font:800 11px 'Plus Jakarta Sans';display:grid;place-items:center;box-shadow:0 4px 10px rgba(192,85,63,.5);animation:pop .4s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.notif-box{display:none;position:absolute;right:0;top:58px;width:346px;background:#fffdfb;border:1px solid var(--line);border-radius:16px;box-shadow:0 26px 60px rgba(80,48,31,.22);z-index:30;overflow:hidden}
.notif-box.show{display:block;animation:drop .25s ease}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.notif-head{padding:15px 16px;background:linear-gradient(135deg,#f7e5d8,#efd6c4)}
.notif-head b{font-family:'Playfair Display',serif;font-size:16px;color:var(--brown-2)}
.notif-head small{display:block;color:#9c7f6d;font-size:11.5px;margin-top:2px}

/* ---------- Buttons ---------- */
.primary{background:linear-gradient(135deg,#7a5340,#56362a);color:#fff8f3;padding:12px 18px;border-radius:13px;font-weight:700;font-size:13.5px;box-shadow:0 12px 26px rgba(96,58,40,.28)}
.primary:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(96,58,40,.34)}
.secondary{background:#f3e6da;color:var(--brown-2);padding:10px 14px;border-radius:11px;font-weight:700;font-size:12.5px}
.secondary:hover{background:#ecdac9;transform:translateY(-1px)}
.add{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#f5e3d5,#edd2bd);color:var(--brown-2);font-size:20px;font-weight:800;box-shadow:var(--shadow-sm)}
.stock-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;margin-bottom:8px}
.stock-pill.ok{background:#e6f3ea;color:#3f7d5a}
.stock-pill.low{background:#fdf1e3;color:#b6792f}
.stock-pill.out{background:#fbe6e2;color:#c0553f}
.add:disabled,.qty button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.add:hover{transform:translateY(-2px) scale(1.05)}

/* ---------- Cards & grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:rgba(255,253,251,.94);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm)}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,#fffdfb,#fbf2ea)}
.stat:after{content:'';position:absolute;width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#f6e2d2,#efd3bd);right:-34px;top:-40px;opacity:.75}
.stat .sc-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#8a5c44,#5f3c2c);color:#fff}
.stat .sc-label{position:absolute;top:20px;left:70px;right:20px;font-size:12.5px;color:#9a8377;font-weight:600}
.stat b{display:block;font-size:25px;margin-top:20px;color:var(--brown-2);font-weight:800}
.stat small{display:inline-block;margin-top:8px}

/* ---------- Products ---------- */
.products{display:grid;grid-template-columns:repeat(auto-fill,261.2px);gap:16px;justify-content:start}
.product{width:261.2px;height:343.6px;box-sizing:border-box;padding:0;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease;display:flex;flex-direction:column;background:#fffdfb;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(88,54,33,.05)}
.product:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(96,58,40,.14)}
.art{height:124px;display:grid;place-items:center;font-size:54px;background:linear-gradient(140deg,#fbf0e6,#f3dac6);border-bottom:1px solid var(--line);flex-shrink:0}
.product section{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1;box-sizing:border-box;overflow:hidden}
.product h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--brown-2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product p{font-size:12px;color:#9a8377;min-height:34px;margin:0 0 10px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.star-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:26px;margin-bottom:8px}
.rating-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8a5c34;background:#fdf1e3;border:1px solid #f2dbcb;padding:3px 8px;border-radius:999px;cursor:pointer;line-height:1.3;transition:transform .15s ease,background .15s ease}
.rating-chip:hover{background:#f8e1cc;transform:scale(1.04)}
.promo-chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:#3f7d5a;background:#e6f3ea;border:1px solid #cfe5d7;padding:3px 8px;border-radius:999px;line-height:1.3}
.price-row{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--brown-2);margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.price-row span{font-size:16px}
.add{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7a5340,#5b3a2b);color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 12px rgba(91,58,43,.26);display:grid;place-items:center;transition:transform .18s ease,box-shadow .18s ease}
.add:hover:not(:disabled){transform:scale(1.08);box-shadow:0 8px 18px rgba(91,58,43,.36)}
.add:disabled{opacity:.4;cursor:not-allowed;background:#e8d8ca;color:#b8a090;box-shadow:none}

/* ---------- Product image ---------- */
.art{position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .art-emoji{font-size:54px;display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(140deg,#fbf0e6,#f3dac6)}
.img-preview{width:100%;height:160px;border:1.5px dashed var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#fdf7f1;margin-top:8px;position:relative}
.img-preview img{width:100%;height:100%;object-fit:cover;display:block}
.img-preview span{color:#a99a90;font-size:12px}
.upload-hint{font-size:11px;color:#9a8377;margin-top:6px}

/* ---------- Layout / cart ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.cart{height:max-content;position:sticky;top:20px;border-radius:18px}
.cart h2{font-size:18px;color:var(--brown-2);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cart-row{display:flex;gap:11px;align-items:center;margin:12px 0}
.cart-row .mini{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f7e6d9,#eed1bb);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.cart-row div:nth-child(2){flex:1;font-weight:600}
.qty{display:flex;align-items:center;gap:8px;font-weight:700}
.qty button{width:26px;height:26px;border-radius:9px;background:#f2e3d7;color:var(--brown-2);font-weight:800}
.qty button:hover{background:#e8d3c2}
.total{border-top:1px dashed var(--line);padding-top:14px;margin-top:12px;display:flex;justify-content:space-between;font-weight:800;color:var(--brown-2);font-size:15px}

/* ---------- Tables ---------- */
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{text-align:left;padding:12px 12px;color:#9a8377;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.table td{padding:14px 12px;border-bottom:1px solid #f4ebe4;font-size:12.5px;vertical-align:middle}
.table tbody tr,.table tr{transition:background .18s}
.table tr:hover td{background:#fff8f2}
.table tr:last-child td{border-bottom:0}
.status{display:inline-block;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:800;background:#fbeeda;color:var(--warn)}
.status.done{background:#e6f3ea;color:var(--ok)}
.status.process{background:#e8eff5;color:var(--sky)}
.status.wait{background:#fbeeda;color:var(--warn)}

/* ---------- Forms & modal ---------- */
.field{margin:14px 0}
.field label{display:block;margin-bottom:7px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#987e6e;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fffdfb;transition:.18s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 4px rgba(122,83,64,.12)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(50,32,23,.5);backdrop-filter:blur(5px);display:none;place-items:center;z-index:50}
.modal.show{display:grid;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .card{width:min(540px,94vw);max-height:92vh;overflow:auto;border-radius:22px;padding:26px;animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.modal .card h2{color:var(--brown-2);font-size:22px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:linear-gradient(135deg,#5b3a2b,#7a5340);color:#fff8f3;padding:14px 22px;border-radius:14px;box-shadow:0 20px 45px rgba(70,42,28,.4);opacity:0;pointer-events:none;transition:.28s;z-index:60;font-weight:600;font-size:13.5px}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Charts & misc ---------- */
.chart-note{display:flex;gap:9px;align-items:center;margin-top:12px;color:#9a8377;font-size:12px;font-weight:600}
.chart-note i{width:9px;height:9px;border-radius:50%;background:var(--brown)}
.po-box{background:linear-gradient(135deg,#fdf3ea,#f8ece1);border:1px dashed #d9bda9;border-radius:14px;padding:15px}
.track-chip{display:inline-flex;align-items:center;gap:7px;background:var(--latte);color:var(--brown-2);padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:800}
.empty{text-align:center;padding:50px 20px;color:#a99a90}

/* ---------- Payment ---------- */
.pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:6px}
.pay-method{position:relative;border:2px solid var(--line);border-radius:14px;padding:13px;background:#fffdfb;cursor:pointer;display:flex;gap:11px;align-items:center}
.pay-method:hover{border-color:#d3b6a3;transform:translateY(-2px)}
.pay-method input{position:absolute;opacity:0}
.pay-method .pm-icon{width:40px;height:40px;border-radius:12px;background:var(--latte);display:grid;place-items:center;font-size:19px}
.pay-method b{display:block;font-size:13px}
.pay-method small{color:#9a8377;font-size:11px}
.pay-method.sel{border-color:var(--brown);background:linear-gradient(135deg,#fff8f2,#fdeee2);box-shadow:0 10px 22px rgba(118,81,62,.16)}
.pay-method.sel .pm-icon{background:linear-gradient(135deg,#7a5340,#5b3a2b);color:#fff}
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.bank-chip{border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;background:#fffdfb;font-weight:800;font-size:12px;color:#6d5548}
.bank-chip:hover{border-color:#d3b6a3}
.bank-chip.sel{border-color:transparent;background:linear-gradient(135deg,#7a5340,#5b3a2b);color:#fff;box-shadow:var(--shadow-sm)}
.rek-card{background:linear-gradient(135deg,#5b3a2b,#8a5c44);color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden;box-shadow:0 16px 34px rgba(91,58,43,.35)}
.rek-card:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);right:-40px;top:-50px}
.rek-card small{opacity:.82;font-size:11px;letter-spacing:.8px}
.rek-card .no{font-size:21px;font-weight:800;letter-spacing:1.6px;margin:6px 0 10px}
.rek-card .copy{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:800}
.status-card{border-radius:16px;padding:18px;border:1px solid var(--line);background:#fffdfb}
.status-card.paid{background:linear-gradient(135deg,#eef8f1,#e1f0e7);border-color:#c6e0cf}
.status-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--latte)}
.status-card.paid .status-ico{background:linear-gradient(135deg,#4f7a61,#3d6249);color:#fff}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- Customer Menu ---------- */
.customer-menu .icon-btn{display:flex;align-items:center;gap:8px}
.customer-dropdown .dropdown-item:hover{background:#fff6ee}
.customer-dropdown .dropdown-item:first-child{border-radius:12px 12px 0 0}
.customer-dropdown .dropdown-item:last-child{border-radius:0 0 12px 12px}

/* ---------- Reviews ---------- */
.stars{display:inline-flex;gap:2px;font-size:17px;line-height:1;color:#d9c3b4;cursor:default}
.stars .on{color:#e8a44c}
.stars.pick span{cursor:pointer;transition:transform .12s}
.stars.pick span:hover{transform:scale(1.18)}
.star-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;min-height:28px}
.rating-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#8a5c34;background:#fdf1e3;padding:4px 9px;border-radius:999px}
.review-item{border-top:1px solid var(--line);padding:12px 0}
.review-item:first-child{border-top:0}
.review-item p{margin:6px 0 0;font-size:12.5px;color:#5f4b40}

/* ---------- Chat ---------- */
.chat-wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}
.conv{border:1px solid var(--line);border-radius:16px;background:#fffdfb;padding:16px}
.conv-row{display:flex;gap:11px;align-items:center;padding:11px;border-radius:12px;cursor:pointer;transition:.16s}
.conv-row:hover{background:#fff6ee}
.conv-row.active{background:linear-gradient(135deg,#f7e5d8,#efd6c4)}
.conv-ava{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8a5c44,#5f3c2c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.conv-meta{flex:1;min-width:0}
.conv-meta b{font-size:13px;display:block}
.conv-meta small{color:#9a8377;font-size:11px}
.chat-panel{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fffdfb;min-height:480px}
.chat-head{padding:14px 18px;background:linear-gradient(135deg,#f7e5d8,#efd6c4);display:flex;justify-content:space-between;align-items:center}
.chat-head b{font-family:'Playfair Display',serif;font-size:16px;color:var(--brown-2)}
.chat-body{flex:1;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:#fdf7f1}
.bubble{max-width:76%;padding:11px 14px;border-radius:15px;font-size:13px;line-height:1.45;box-shadow:var(--shadow-sm);position:relative;word-break:break-word}
.bubble small{display:block;font-size:10px;opacity:.7;margin-top:4px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#7a5340,#56362a);color:#fff8f3;border-bottom-right-radius:5px}
.bubble.you{align-self:flex-start;background:#fff;border:1px solid var(--line);color:#4c352a;border-bottom-left-radius:5px}
.chat-input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#fffdfb}
.chat-input input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fffdfb}
.chat-input input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 4px rgba(122,83,64,.12)}
.chat-day{align-self:center;font-size:10.5px;color:#a99a90;background:#f2e7dd;padding:3px 10px;border-radius:999px;font-weight:700}

/* ---------- Responsive ---------- */
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.cart{position:static}.chat-wrap{grid-template-columns:1fr}}
@media(max-width:820px){
 aside{width:82px;padding:20px 10px}
 .brand{font-size:0;margin:6px 4px 18px}.brand:before{margin:0 auto}.brand span,.roles{display:none}
 nav button{justify-content:center;padding:12px 8px}.nav-label{display:none}
 main{padding:22px}
 .products{grid-template-columns:repeat(2,minmax(0,1fr))}
}

  if(method==='POST' && path==='/api/reviews') { mockReviews.push({id:mockReviews.length+1, ...body, created_at:new Date().toISOString()}); saveMock('gb_mock_reviews', mockReviews); return {id:mockReviews.length}; }
  if(method==='GET' && path==='/api/admin/reviews') return mockReviews.slice();
  if(method==='DELETE' && path.match(/^\/api\/reviews\/\d+$/)){ return {ok:true}; }
  // --- Chat ---
  if(method==='GET' && path==='/api/chat') return mockChats.filter(c=>c.phone===(sp.get('phone')||''));
  if(method==='POST' && path==='/api/chat'){ const {phone,sender,message}=body; mockChats.push({id:mockChats.length+1,phone,sender,message,created_at:new Date().toISOString()}); saveMock('gb_mock_chats', mockChats); return {id:mockChats.length}; }
  if(method==='POST' && path==='/api/chat/read') return {ok:true};
  if(method==='GET' && path==='/api/admin/chats') return [];
  // --- Customer auth ---
  if(method==='POST' && path==='/api/auth/register'){
    const {name,phone,email,password}=body;
    if(!name||!phone||!email||!password) throw Object.assign(new Error('Semua field wajib diisi.'),{status:400});
    if(mockCustomers.some(c=>c.phone===phone.replace(/\D/g,'')||c.email===email)) throw Object.assign(new Error('Nomor WhatsApp atau email sudah terdaftar.'),{status:400});
    const id=mockCustomers.length+1;
    mockCustomers.push({id,name,phone:phone.replace(/\D/g,''),email:email.toLowerCase(),password,total_orders:0,total_spent:0,last_order:null});
    saveMock('gb_mock_customers', mockCustomers);
    return {ok:true,message:'Registrasi berhasil. Silakan login.'};
  }
  if(method==='POST' && path==='/api/auth/login'){
    const {identifier,password}=body;
    let cust=mockCustomers.find(c=> c.phone===String(identifier).replace(/\D/g,'') || (c.email && c.email.toLowerCase()===String(identifier).toLowerCase()));
    if(!cust || cust.password!==password) throw Object.assign(new Error('Kredensial tidak valid.'),{status:401});
    return {ok:true,customer:{id:cust.id,name:cust.name,phone:cust.phone,email:cust.email},token:'mock-customer-token-'+cust.id};
  }
  if(method==='POST' && path==='/api/auth/logout') return {ok:true};
  if(method==='GET' && path==='/api/auth/me'){
    if(!token||!token.startsWith('mock-customer-token')) throw Object.assign(new Error('Tidak terautentikasi.'),{status:401});
    const id=parseInt(token.split('-').pop());
    let c=mockCustomers.find(x=>x.id===id);
    if(!c) throw Object.assign(new Error('Tidak terautentikasi.'),{status:401});
    return {customer:{id:c.id,name:c.name,phone:c.phone,email:c.email}};
  }
  // fallback
  console.warn('mockApi unhandled', method, path);
  return {};
}

function salesChart(rows){const w=760,h=240,p=34,values=rows.map(x=>Number(x.revenue)||0),max=Math.max(...values,1),step=rows.length>1?(w-p*2)/(rows.length-1):0,pts=values.map((v,i)=>`${p+i*step},${h-p-(v/max)*(h-p*2)}`).join(' '),labels=rows.map((x,i)=>`<text x="${p+i*step}" y="${h-9}" text-anchor="middle" font-size="11" font-weight="700" fill="#a68a79">${x.date.slice(5)}</text>`).join(''),grid=[0,.25,.5,.75,1].map(n=>`<line x1="${p}" y1="${h-p-n*(h-p*2)}" x2="${w-p}" y2="${h-p-n*(h-p*2)}" stroke="#eddfd4" stroke-dasharray="2 5"/>`).join(''),areas=values.map((v,i)=>`<rect x="${p+i*step-11}" y="${h-p-(v/max)*(h-p*2)}" width="22" height="${Math.max(2,(v/max)*(h-p*2))}" rx="6" fill="#7a5340" opacity="${v?'.14':'.06'}"/>`).join(''),dots=values.map((v,i)=>`<g><circle cx="${p+i*step}" cy="${h-p-(v/max)*(h-p*2)}" r="5.5" fill="#fff" stroke="#7a5340" stroke-width="3"><title>${rows[i].date}: ${rupiah(v)}</title></circle><text x="${p+i*step}" y="${h-p-(v/max)*(h-p*2)-14}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#5b3a2b">${v?(Math.round(v/1000))+'rb':''}</text></g>`).join('');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:260px;display:block;overflow:visible" role="img" aria-label="Grafik tren penjualan">${grid}${areas}<polyline points="${pts}" fill="none" stroke="#7a5340" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg><div class="chart-note"><i></i> Omzet harian 7 hari terakhir</div>`}/* Data pelanggan: hanya menampilkan customer dengan pesanan langsung. */

function sendAdminChat(){let m=document.querySelector('#chatMsg'),c=state.chatList?.find(x=>x.customer_id===state.chatWith);if(!m||!m.value.trim()||!c)return;api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:c.phone,sender:'admin',message:m.value.trim()})}).then(()=>{m.value='';chat()}).catch(e=>toast(e.message))}
function openAdminChat(id){state.chatWith=id;chat()}
async function orders(){let os=await api('/api/orders');document.getElementById('content').innerHTML=`<div class="card"><h2>Daftar Pesanan</h2><p class="muted">Pantau status pesanan dan pembayaran. Pembayaran customer masuk otomatis ke notifikasi.</p><div style="overflow:auto"><table class="table"><tr><th>KODE</th><th>PELANGGAN</th><th>KETERANGAN</th><th>TOTAL</th><th>PEMBAYARAN</th><th>STATUS</th><th>AKSI</th></tr>${os.length?os.map(o=>`<tr><td><b>${o.code}</b><br><small class="muted">${new Date(o.created_at+'Z').toLocaleString('id-ID')}</small></td><td>${escapeHtml(o.customer_name||'-')}<br><small class="muted">${escapeHtml(o.phone||'')}</small></td><td style="min-width:210px;max-width:280px">${(o.items&&o.items.length?o.items.map(it=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #eddfd4"><span>${escapeHtml(it.product_name)} <small class="muted">x${it.quantity}</small></span><span style="white-space:nowrap"><small class="muted">${rupiah(it.unit_price)} \u00d7 ${it.quantity}</small> <b>${rupiah(it.subtotal)}</b></span></div>`).join(''):'<span class="muted" style="font-size:12px">-</span>')}${o.notes?`<div style="margin-top:6px;font-size:11px;color:#9a8377;background:#fdf7f1;padding:6px 8px;border-radius:8px;border:1px solid var(--line)">\u2709 ${escapeHtml(o.notes)}</div>`:''}</td><td><b>${rupiah(o.total)}</b></td><td>${o.payment_status==='dibayar'?`<span class="status done">Lunas</span>`:`<span class="status wait">Belum bayar</span>`}<br><small class="muted">${payMethodLabel2(o.payment_method)}${o.payment_bank?' \u00b7 '+escapeHtml(o.payment_bank):''}</small></td><td><span class="status ${o.status==='selesai'?'done':'process'}">${o.status.replace('_',' ')}</span></td><td><div style="display:flex;gap:6px;flex-wrap:wrap">${o.payment_status!=='dibayar'?`<button class="secondary" onclick="markPaid(${o.id},'${o.payment_method||'tunai'}')">Konfirmasi lunas</button>`:''}<button class="secondary" onclick="nextStatus(${o.id},'${o.status}')">Ubah status</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="muted">Belum ada pesanan.</td></tr>'}</table></div></div>`}
async function markPaid(id,method){try{await api('/api/orders/'+id+'/payment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentStatus:'dibayar',method})});toast('Pembayaran dikonfirmasi lunas');adminNotif();orders()}catch(err){toast(err.message)}}getProducts().then(render).catch(e=>toast(e.message));


























</script></body></html>
